name: Nightly Deploy to TEST Workspace

on:
  schedule:
    # Ogni giorno alle 2:00 del mattino (UTC)
    - cron: '55 7 * * *'
  workflow_dispatch:

jobs:
  Deploy-To-Fabric-Test:
    runs-on: ubuntu-latest
    steps:
      - name: Autenticazione su Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          allow-no-subscriptions: true

      - name: Recupero Token API Fabric
        run: |
          TOKEN=$(az account get-access-token --resource "https://api.fabric.microsoft.com/" --query accessToken -o tsv)
          echo "FABRIC_TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Sincronizzazione Workspace TEST
        run: |
          CRED_PAYLOAD=$(jq -n \
            --arg cid "${{ secrets.FABRIC_GIT_CONNECTION_ID }}" \
            '{
              source: "ConfiguredConnection",
              connectionId: $cid
            }')

          CRED_RES=$(curl -s -w "\n%{http_code}" -X PATCH \
            -H "Authorization: Bearer ${{ env.FABRIC_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$CRED_PAYLOAD" \
            "https://api.fabric.microsoft.com/v1/workspaces/${{ secrets.WORKSPACE_ID_TEST }}/git/myGitCredentials")

          CRED_CODE=$(echo "$CRED_RES" | tail -n1)
          CRED_BODY=$(echo "$CRED_RES" | sed '$d')

          if [ "$CRED_CODE" -ge 400 ]; then
            echo "Errore configurazione Git credentials ($CRED_CODE): $CRED_BODY"
            exit 1
          fi

          STATUS_RES=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ env.FABRIC_TOKEN }}" \
            "https://api.fabric.microsoft.com/v1/workspaces/${{ secrets.WORKSPACE_ID_TEST }}/git/status")

          HTTP_CODE=$(echo "$STATUS_RES" | tail -n1)
          BODY=$(echo "$STATUS_RES" | sed '$d')

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "Errore lettura Git status ($HTTP_CODE): $BODY"
            exit 1
          fi

          WORKSPACE_HEAD=$(echo "$BODY" | jq -r '.workspaceHead')
          REMOTE_HASH=$(echo "$BODY" | jq -r '.remoteCommitHash')

          echo "Workspace Head: $WORKSPACE_HEAD"
          echo "Remote Commit Hash: $REMOTE_HASH"

          if [ "$WORKSPACE_HEAD" = "$REMOTE_HASH" ]; then
            echo "Workspace già allineato con Git. Nessun aggiornamento necessario."
            exit 0
          fi

          PAYLOAD=$(jq -n \
            --arg wh "$WORKSPACE_HEAD" \
            --arg rh "$REMOTE_HASH" \
            '{
              workspaceHead: $wh,
              remoteCommitHash: $rh,
              conflictResolution: {
                conflictResolutionType: "Workspace",
                conflictResolutionPolicy: "PreferRemote"
              },
              options: {
                allowOverrideItems: true
              }
            }')

          HEADERS_FILE=$(mktemp)
          UPDATE_RES=$(curl -s -D "$HEADERS_FILE" -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ env.FABRIC_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "https://api.fabric.microsoft.com/v1/workspaces/${{ secrets.WORKSPACE_ID_TEST }}/git/updateFromGit")

          UPDATE_CODE=$(echo "$UPDATE_RES" | tail -n1)
          UPDATE_BODY=$(echo "$UPDATE_RES" | sed '$d')

          echo "Risposta iniziale Fabric ($UPDATE_CODE): $UPDATE_BODY"

          if [ "$UPDATE_CODE" -ge 400 ]; then
            echo "Errore durante l'avvio dell'aggiornamento!"
            exit 1
          fi

          if [ "$UPDATE_CODE" -eq 202 ]; then
            OP_ID=$(grep -i '^x-ms-operation-id:' "$HEADERS_FILE" | awk '{print $2}' | tr -d '\r')
            echo "Operazione asincrona avviata (ID: $OP_ID). Attesa completamento..."

            for i in $(seq 1 30); do
              sleep 5
              OP_RES=$(curl -s \
                -H "Authorization: Bearer ${{ env.FABRIC_TOKEN }}" \
                "https://api.fabric.microsoft.com/v1/operations/$OP_ID")
              OP_STATUS=$(echo "$OP_RES" | jq -r '.status')
              echo "Tentativo $i - Stato operazione: $OP_STATUS"

              if [ "$OP_STATUS" = "Succeeded" ]; then
                echo "Sincronizzazione completata con successo su Fabric!"
                exit 0
              elif [ "$OP_STATUS" = "Failed" ]; then
                echo "Sincronizzazione fallita su Fabric: $OP_RES"
                exit 1
              fi
            done

            echo "Timeout: l'operazione non è terminata entro 150 secondi."
            exit 1
          fi
